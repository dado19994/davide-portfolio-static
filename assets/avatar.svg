<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1c1408"/>
      <stop offset="100%" stop-color="#070a0b"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(251,191,36,0.18)"/>
      <stop offset="100%" stop-color="rgba(251,191,36,0)"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <circle cx="60" cy="60" r="60" fill="url(#bg)"/>
  <!-- Glow -->
  <circle cx="60" cy="60" r="60" fill="url(#glow)"/>
  <!-- Gold ring -->
  <circle cx="60" cy="60" r="58" fill="none" stroke="rgba(251,191,36,0.38)" stroke-width="1"/>
  <!-- Inner subtle ring -->
  <circle cx="60" cy="60" r="54" fill="none" stroke="rgba(251,191,36,0.1)" stroke-width="0.5"/>
  <!-- Initials -->
  <text x="60" y="67"
        text-anchor="middle"
        dominant-baseline="middle"
        font-family="Sora, system-ui, sans-serif"
        font-weight="700"
        font-size="30"
        letter-spacing="-1"
        fill="#fbbf24">DD</text>
</svg>
